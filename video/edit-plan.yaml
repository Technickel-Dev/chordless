# Edit plan for "Chordless: The Conductor of AI" (trailer cut): the machine half of video/script.md.
#
# Every shot ID here matches one in script.md. An agent driving the DaVinci
# Resolve MCP builds the timeline from this file, top to bottom:
#
#   1. create the project and the timeline (`timeline`), and import every file
#      under `media` into the media pool;
#   2. resolve every time (see "Time" below), then place `beat1` .. `beat7`
#      clips on their tracks;
#   3. place the music `stems`, then `vo` and `sfx`, then `cards`, `supers`
#      and `credits`;
#   4. apply the `rage` ramps, add the `markers`, check the end against
#      `timeline.max_end`, render.
#
# If the MCP can't place a clip at a record position, generate an OpenTimelineIO
# (.otio) file from this plan and import it instead (Resolve: File > Import >
# Timeline). That's also the fastest way to rebuild after a change here.
#
# Time. Three kinds of address, all resolved to timeline seconds:
#   at: 12.0                 timeline seconds
#   bar: 260  (or 243.75)    a score bar of the finale; a fraction is that far
#                            through the bar (243.75 = its last eighth note)
#                            t = score.start + song_seconds(bar)
#   end: 3.5                 seconds after score.end (beat 7)
# song_seconds(bar) is the time from the arrangement's first note to that bar's
# downbeat, read from tests/songs/william-tell.js (beats * 60 / tempo; today
# bar 244 is beat 0 and a bar is 2 beats at 152 bpm, so a bar is 0.789474 s).
# score.end is the closing chord plus `score.tail`.
#
# Take sync. Every Chordless take plays the same arrangement, so a take's source
# in-point for a clip starting at score position P is
#   source_in = take.beat0 + song_seconds(P) - song_seconds(beat 0)
# where `beat0` is the second in the take's file where the song's beat 0 falls.
# Fill it in after recording: find the onset of the take's first note and
# subtract that note's song_seconds offset from beat 0.
#
# Status. Bars 243-276 (the galop theme) are arranged and their bars are final.
# Sections marked `bars: TBD` wait for the full arrangement; give each its first
# and last bar, then lay its clips out with its `cut_every_bars` rule. Their
# `at` below are budgets (the section lengths in script.md), good to about a second.

timeline:
  name: chordless-conductor-of-ai-trailer-v2
  fps: 60
  width: 1920
  height: 1080
  max_end: 175.0 # 2:55; the rules say under 3:00

tracks:
  video:
    V1: app footage (takes and real captures)
    V2: AI clips and conductor cutaways, over V1
    V3-V11: the 3x3 grid before the coda, one tile per track
    V12: full-screen shots over the grid (coda, final chord, cutoff)
    V13: titles, cards, captions and credits
    V14: rage overlays (red grade, vignette, white-out), adjustment clip over everything below
  audio:
    A1: voiceover
    A2: trumpet
    A3: guitar
    A4: cello
    A5: violin
    A6: piano
    A7: triangle
    A8: drums
    A9: cymbals
    A10: SFX and ambience
    A11: real-capture audio (R-quest)
    A12: the guitar tune (beat 2)
    A13: trombone
    A14: horn

media:
  ai: # clips/<id>.mp4
    [1-1, 1-2, 1-3, 1-4, 1-5, 1-6, 1-7, 1-9, c-1, c-2, c-3, c-4, c-5, c-6, c-grid, 7-1]
  tune: # takes/<id>.mp4, audio in the same file
    [guitar-cliffside-tune, guitar-cliffside-rage]
  smash: # takes/<id>.mp4, one scripted smash each; audio in the same file
    [smash-guitar-cliffside, smash-piano-clock-tower, smash-drums-living-room,
     smash-trumpet-pirate-ship, smash-violin-underwater, smash-cello-balloon-basket,
     smash-cymbals-library, smash-triangle-fridge, smash-trombone-jazz-club,
     smash-horn-mountaintop, smash-stage-finale]
  takes: # takes/<id>.mp4, audio in the same file; the played-through takes
    trumpet-pirate-ship: { beat0: null }
    guitar-cliffside: { beat0: null }
    guitar-train-roof: { beat0: null }
    cello-balloon-basket: { beat0: null }
    cello-lantern-lake: { beat0: null }
    violin-underwater: { beat0: null }
    violin-northern-lights: { beat0: null }
    piano-clock-tower: { beat0: null }
    piano-stage: { beat0: null }
    triangle-fridge: { beat0: null }
    drums-living-room: { beat0: null }
    drums-neon-arcade: { beat0: null }
    cymbals-library: { beat0: null }
    cymbals-bowling-alley: { beat0: null }
    trombone-jazz-club: { beat0: null }
    horn-mountaintop: { beat0: null }
  montage: # takes/<id>.mp4, one bar each in the environments run, in this order
    [piano-space-station, drums-volcano-rim, drums-pinball, cello-bouncy-castle,
     violin-snow-globe, guitar-lava-lamp, trumpet-giant-turtle, piano-upside-down-room,
     guitar-stadium, trumpet-desert-canyon, violin-ice-cave, drums-record-player]
  real: [R-quest, R-scene-flip] # takes/<id>.mp4
  vo: [vo-1-2, vo-1-3, vo-1-4, vo-1-5, vo-1-6, vo-1-7, vo-1-8, vo-a, vo-b, vo-7-2, vo-7-3]
  sfx: [sfx-tuning, sfx-baton-tap, sfx-heartbeat, sfx-whoosh, sfx-card-slam, sfx-bass-hit, sfx-applause, sfx-broom-knock] # audio/<id>.wav

# -------------------------------------------------------------- beat 1: conductor of AI
beat1:
  - { id: 1-1, track: V2, at: 0.000, until: 3.000 }
  - { id: 1-2, track: V2, at: 3.000, until: 9.000 }
  - { id: 1-3, track: V2, at: 9.000, until: 12.000, note: gag - the cello's plane seat }
  - { id: 1-4, track: V2, at: 12.000, until: 15.000, note: gag - the 2 a.m. drummer }
  - { id: 1-5, track: V2, at: 15.000, until: 18.000, note: gag - the stuck piano }
  - { id: 1-6, track: V2, at: 18.000, until: 21.000, note: gag - the library cymbals }
  - { id: 1-7, track: V2, at: 21.000, until: 25.000, note: the vanishing act }
  - { id: guitar-cliffside, track: V1, at: 25.000, until: 27.000, in: 2.0, speed: 0.5, grade: "darken -1.5 stops", note: title card background }
  - { id: 1-9, track: V2, at: 27.000, until: 30.000, note: the downbeat lands on the cut }

# ------------------------------------------------- beat 2 and 3: the tune, the flub
tune:
  start: 30.000 # timeline second of the tune's first note
  tempo: 100
  meter: 4/4 # a bar is 2.4 s; bar 6 begins at 42.0
  flub_at: 43.800 # bar 6, last beat; move to the take's actual wrong note
  clips:
    - { take: guitar-cliffside-tune, track: V1, at: 30.000, until: 43.800, note: the tune, slow push-in on the fretting hand }
    - { take: guitar-cliffside-tune, track: V1, at: 43.800, until: 44.800, zoom: 2.0, note: punch in on the wrong fret, hold 1 s }
    - { id: c-1, track: V2, at: 44.300, until: 45.300, note: the look; the sunglasses become 😐 }
  silence: { from: 43.800, until: 45.300, keep: room-tone only (wind), no music tail }
  audio_cut: { take: guitar-cliffside-tune, track: A12, hard_cut_at: 43.800 }

# ------------------------------------------------------------------ the score
score:
  start: 45.3 # timeline second of the arrangement's first note, cold into the silence
  tempo: 152
  tail: 2.5 # seconds from the closing chord to the end of the cutoff shot
  budget: 110.0 # the score may run at most this long, or beat 7 overflows max_end

  sections:
    # ---- beat 4: the rage (45.3 - 67.9)
    - id: fanfare
      beat: 4
      bars: TBD
      budget: [45.3, 55.3]
      playing: [trumpet]
      cut_every_bars: 8
      clips:
        - { take: guitar-cliffside-rage, track: V1 }
        - { id: c-2, track: V2, at: 45.8, until: 47.8 } # the fist
      cut_to_black: { at: 55.3, frames: 4 }

    - id: galop-quiet
      beat: 4
      bars: [243.75, 259.75] # from the pickup to the tutti's pickup; ends at about 67.9
      playing: [trumpet, guitar]
      clips:
        - { take: guitar-cliffside-rage, track: V1, bar: 243.75, until_bar: 252 }
        - { id: c-3, track: V2, at: 54.8, until: 56.8 }
        - { take: guitar-cliffside-rage, track: V1, bar: 252, until_bar: 255, zoom: 1.4, note: the swing, a little wilder }
        - { id: c-4, track: V2, at: 61.8, until: 63.8 } # the podium
        - { take: guitar-cliffside-rage, track: V1, bar: 255, until_bar: 259.75, zoom: 1.6, note: punch in on the fretting hand, cuts every bar }

    # ---- beat 5: the high point (67.9 - 80.5)
    - id: galop-loud
      beat: 5
      bars: [259.75, 276]
      playing: [trumpet, guitar, cello]
      clips:
        - { take: smash-guitar-cliffside, track: V1, bar: 259.75, until_bar: 260, note: the white clears on the guitar }
        - { take: smash-guitar-cliffside, track: V1, bar: 260, until_bar: 261, speed_ramp: [0.25, 1.0], note: the swing into the floor, 0.25x for one beat then ramp to full }
        - { take: smash-guitar-cliffside, track: V1, bar: 261, until_bar: 262, note: strings snap, chunks tumble }
        - { id: c-5, track: V2, bar: 261, bars_long: 0.5, note: the grin, on the chunks }
        - { take: smash-guitar-cliffside, track: V1, bar: 262, until_bar: 264, note: the neck thrown, the hand opens }
        - { take: smash-piano-clock-tower, track: V1, bar: 264, until_bar: 266, note: pushed over }
        - { take: smash-drums-living-room, track: V1, bar: 266, until_bar: 268, note: pulled off their stands }
        - { take: smash-trumpet-pirate-ship, track: V1, bar: 268, until_bar: 270 }
        - { take: smash-violin-underwater, track: V1, bar: 270, until_bar: 272 }
        - { take: smash-cello-balloon-basket, track: V1, bar: 272, until_bar: 274 }
        - { take: smash-cymbals-library, track: V1, bar: 274, until_bar: 276 }

    # ---- beat 6: the cards
    - id: middle-quiet
      beat: 6
      bars: TBD
      budget: [80.5, 98.5]
      playing: [trumpet, guitar, cello, violin, trombone, horn]
      cut_every_bars: 2
      clips:
        - { note: "a pinch of both hands, everything comes back whole (the repair gesture)", take: smash-guitar-cliffside, track: V1, bars_long: 2, in: repair }
        # then one instrument per 2 bars, in this order, ten in all
        - { take: violin-underwater, track: V1 }
        - { take: cello-lantern-lake, track: V1 }
        - { take: trombone-jazz-club, track: V1 }
        - { take: horn-mountaintop, track: V1 }
        - { take: trumpet-pirate-ship, track: V1 }
        - { take: piano-clock-tower, track: V1 }
        - { take: triangle-fridge, track: V1 }
        - { take: drums-neon-arcade, track: V1 }
        - { take: cymbals-library, track: V1 }
        - { take: guitar-train-roof, track: V1 }

    - id: middle-build
      beat: 6
      bars: TBD
      budget: [98.5, 112.5]
      playing: [trumpet, guitar, cello, violin, trombone, horn, piano, triangle]
      cut_every_bars: 4
      clips:
        - { take: piano-stage, track: V1 }
        - { take: triangle-fridge, track: V1 }
        - { take: violin-northern-lights, track: V1 }
        - { take: cello-lantern-lake, track: V1 }
        - { take: guitar-train-roof, track: V1 }

    - id: galop-returns
      beat: 6
      bars: TBD
      budget: [112.5, 128.5]
      playing: [trumpet, guitar, cello, violin, trombone, horn, piano, triangle, drums]
      cut_every_bars: 1
      clips:
        - { take: R-scene-flip, track: V1, bars_long: 4, note: the player's real hands on Next scene }
        - { montage: true, track: V1, note: one environment per bar, in order, then repeat the list until the section ends }

    - id: pre-coda
      beat: 6
      bars: TBD
      budget: [128.5, 138.5]
      playing: [trumpet, guitar, cello, violin, trombone, horn, piano, triangle, drums]
      # The grid: each tile is its take scaled to 1/3 and moved by pan/tilt in
      # pixels. The centre tile runs the whole section; the others enter one
      # every 2 bars in this order. All tiles run until the final chord.
      grid:
        - { id: c-grid, track: V7, zoom: 0.333, pan: 0, tilt: 0, retime: "conducting on the beat at 152 bpm" }
        - { take: trumpet-pirate-ship, track: V3, zoom: 0.333, pan: -640, tilt: 360 }
        - { take: guitar-cliffside, track: V4, zoom: 0.333, pan: 0, tilt: 360 }
        - { take: cello-balloon-basket, track: V5, zoom: 0.333, pan: 640, tilt: 360 }
        - { take: violin-underwater, track: V6, zoom: 0.333, pan: -640, tilt: 0 }
        - { take: piano-clock-tower, track: V8, zoom: 0.333, pan: 640, tilt: 0 }
        - { take: triangle-fridge, track: V9, zoom: 0.333, pan: -640, tilt: -360 }
        - { take: drums-neon-arcade, track: V10, zoom: 0.333, pan: 0, tilt: -360 }
        - { take: cymbals-bowling-alley, track: V11, zoom: 0.333, pan: 640, tilt: -360, note: "arrives last, poised and silent" }
      real: { id: R-quest, track: V2, bars_long: 4, note: the BARE HANDS card sits on this; optional }

    - id: coda
      beat: 6
      bars: TBD
      budget: [138.5, 152.5]
      playing: [trumpet, guitar, cello, violin, trombone, horn, piano, triangle, drums, cymbals]
      cut_every_bars: 1
      # Full-screen shots on V12 over the grid. Bar 1 of each 4-bar phrase is
      # left empty so the grid shows; the first bar of the coda is the cymbals.
      clips:
        - { take: smash-cymbals-library, track: V12, bars_long: 1, note: the cymbals' first crash }
        - { montage: true, track: V12, skip_phrase_downbeats: true }

    - id: final-chord
      beat: 6
      bars: TBD # the closing chord
      budget: [152.5, 155.3]
      playing: all
      clips:
        - { take: smash-stage-finale, track: V12, until: cymbal-choke, note: "the Theatre, the whole stage comes apart on the last crash" }
        - { id: c-6, track: V12, from: cymbal-choke, until_end: 0.0, note: fist cutoff }

# ------------------------------------------------------------------- beat 7
beat7:
  - { id: 7-1, track: V2, end: 0.0, until_end: 3.0 }
  - { id: R-quest, track: V1, end: 3.0, until_end: 9.0 }
  - { id: R-scene-flip, track: V1, end: 9.0, until_end: 11.0 }
  - { id: end-card, track: V13, end: 11.0, until_end: 17.0, kind: title, text: ["CHORDLESS", "Built with IWSDK, Meta's Immersive Web SDK, for Meta Quest", "<GitHub Pages URL>", "Meta VR Start Developer Competition 2026"] }

# ----------------------------------------------------------- rage ramps (beat 4)
# All applied on V14 over the whole of beat 4 and the first second of beat 5.
# Ramp values are linear in score time, 0 at `from` to the peak at `to`.
rage:
  from: 45.3
  to: 67.9 # bar 260, the downbeat of the tutti
  clear_by: 68.9 # the white clears into the smash
  ramps:
    - { param: red_grade, from: 45.3, to: 61.3, peak: 1.0 }
    - { param: vignette, from: 45.3, to: 61.3, peak: 1.0 }
    - { param: shake_px, from: 49.3, to: 65.3, peak: 12 }
    - { param: exposure_stops, from: 57.3, to: 67.9, peak: 5.0, note: ends in a clean white }
    - { param: chroma_aberration, from: 57.3, to: 67.9, peak: 1.0 }
    - { param: cut_every_bars, from: 45.3, to: 67.9, start: 8, end: 1 }

# ------------------------------------------------------------------ the cards
# A card is a game-trailer slam: a quarter-second dark dip, big white type (Text+),
# a stinger, then gone. All on V13 and A10.
cards:
  - { id: card-full-destruction, text: "FULL DESTRUCTION", bar: 264, dur: 3.5, stinger: sfx-card-slam, under: smash montage, note: on the first non-guitar smash }
  - { id: card-multiple-instruments, text: "MULTIPLE INSTRUMENTS", section: middle-quiet, offset: 0.3, dur: 3.5, stinger: sfx-card-slam }
  - { id: card-changing-environments, text: "CHANGING ENVIRONMENTS", section: galop-returns, offset: 0.3, dur: 3.5, stinger: sfx-card-slam }
  - { id: card-bare-hands, text: "BARE HANDS", section: pre-coda, offset: 0.3, dur: 3.0, stinger: sfx-card-slam, optional: true, note: "subtitle: NO CONTROLLERS, NO INSTALL" }

# ---------------------------------------------------------------------- audio
# Music: each instrument's stem is its take's audio, one continuous clip from
# the section it joins in to the end of the score, starting 0.3 s early
# to keep any pickup notes. Mute stems outside their `playing` sections rather
# than cutting them, so a different layering is one change.
stems:
  levels_db: { default: 0, under_vo: -8 }
  segments:
    - { track: A12, take: guitar-cliffside-tune, from: 30.0, to: 43.8, note: the tune; hard cut on the flub }
    - { track: A2, take: trumpet-pirate-ship, from_section: fanfare }
    - { track: A3, take: guitar-cliffside-rage, from_section: galop-quiet }
    - { track: A4, take: cello-balloon-basket, from_section: galop-loud }
    - { track: A5, take: violin-underwater, from_section: middle-quiet }
    - { track: A13, take: trombone-jazz-club, from_section: middle-quiet }
    - { track: A14, take: horn-mountaintop, from_section: middle-quiet }
    - { track: A6, take: piano-clock-tower, from_section: middle-build }
    - { track: A7, take: triangle-fridge, from_section: middle-build }
    - { track: A8, take: drums-neon-arcade, from_section: galop-returns }
    - { track: A9, take: cymbals-library, from_section: coda }
  fade_out: { tracks: A2-A9 + A13-A14, from_end: -1.0, to_end: 2.0 }
  note: >
    The smash takes carry their own audio (the hits and the strings snapping).
    Keep those on the V1 clip's audio and duck the stems -6 dB for one beat under each hit.

vo: # A1
  - { id: vo-1-2, at: 3.300 }
  - { id: vo-1-3, at: 9.200 }
  - { id: vo-1-4, at: 12.200 }
  - { id: vo-1-5, at: 15.200 }
  - { id: vo-1-6, at: 18.200 }
  - { id: vo-1-7, at: 21.500 }
  - { id: vo-1-8, at: 25.300 }
  - { id: vo-a, at: 31.000, must_fit: true, duck_stems: true, until: 42.000, note: under the tune }
  - { id: vo-b, section: middle-quiet, offset: 5.5, must_fit: true, duck_stems: true }
  - { id: vo-7-2, end: 3.5 }
  - { id: vo-7-3, end: 12.0 }

sfx: # A10, plus the real capture's own audio on A11
  - { id: sfx-baton-tap, at: 27.600 } # beats -4, -3, -2 before the first note at 30.0
  - { id: sfx-baton-tap, at: 28.200 }
  - { id: sfx-baton-tap, at: 28.800 }
  - { id: sfx-tuning, at: 0.000, until: 4.000, fade_out: 1.5 }
  - { id: sfx-heartbeat, at: 45.3, until: 67.9, rate_ramp: [1.0, 2.0], note: doubling in rate, on the beat }
  - { id: sfx-whoosh, at: 54.9, note: into the cut to black }
  - { id: sfx-bass-hit, bar: 260, note: the swing into the floor, under the speed ramp }
  - { id: sfx-applause, end: -0.5, until_end: 8.0, fade_out: 2.0 }
  - { id: R-quest, track: A11, end: 3.0, until_end: 9.0, level_db: -14 }
  - { id: sfx-broom-knock, end: 17.5, optional: true }

# ------------------------------------------------------ captions and credits
supers: # V13, lower third; line 2 italic
  - { at: 25.000, until: 27.000, kind: title, text: ["CHORDLESS", "Air instruments for Meta Quest. Played with your bare hands."] }
  - { at: 31.000, dur: 3.0, text: ["GUITAR · Cliffside Sunset"] }
  - { section: middle-quiet, offset_bars: 2, bars_long: 2, text: ["VIOLIN · Underwater"] }
  - { section: middle-quiet, offset_bars: 6, bars_long: 2, text: ["TROMBONE · Jazz Club"] }
  - { section: middle-quiet, offset_bars: 8, bars_long: 2, text: ["FRENCH HORN · Mountaintop"] }
  - { section: galop-returns, offset: 0.0, bars_long: 4, text: ["Drums · Grandma's Living Room", "2:13 a.m. Headphones in. Grandma's still asleep."] }

credits: # V13
  - { id: tune-credit, at: 30.000, until: 36.000, position: top-left, text: ["Ludwig van Beethoven · Ode to Joy (1824) · Public domain"] }
  - { id: music-credit, at: 45.3, until: 51.3, position: top-left, text: ["Gioachino Rossini · William Tell Overture, Finale (1829) · Public domain"] }
  - { id: capture-credit, at: 30.000, until: 36.000, position: bottom, text: ["In-app capture. Every note is played and synthesized live in Chordless."] }
  - { id: capture-bug, at: 30.000, until_end: 0.0, position: top-right, size: small, text: ["IN-APP CAPTURE"] }
  - id: end-credits
    end: 11.0
    until_end: 17.0
    position: under end card
    size: small
    text:
      - "Music: Beethoven, Ode to Joy (1824), and Rossini, William Tell Overture, Finale (1829). Both public domain."
      - "William Tell arranged from the full score typeset by Max Wilkinson (2008), IMSLP #22579, CC BY 3.0."
      - "All music is in-app capture: every note played and synthesized live by Chordless. No recordings used."
      - "Performances recorded in IWSDK's XR emulator with scripted hands, and on Meta Quest."
      - "Built with IWSDK (Meta's Immersive Web SDK) and WebXR. Conductor scenes are AI-generated; all gameplay is real."

markers:
  - { at: 0.0, name: "Beat 1: the conductor of AI" }
  - { at: 9.0, name: "The gag montage" }
  - { at: 30.0, name: "Beat 2: the tune" }
  - { at: 43.8, name: "Beat 3: the flub" }
  - { at: 45.3, name: "Beat 4: the rage; William Tell enters" }
  - { section: galop-quiet, name: "Galop; red grade at half" }
  - { bar: 260, name: "Beat 5: the high point; white-out; the smash" }
  - { section: middle-quiet, name: "MULTIPLE INSTRUMENTS card; VO-B" }
  - { section: galop-returns, name: "CHANGING ENVIRONMENTS card; drums in" }
  - { section: pre-coda, name: "Grid builds; BARE HANDS card" }
  - { section: coda, name: "Coda: cymbals" }
  - { end: 0.0, name: "Beat 7: the bow" }

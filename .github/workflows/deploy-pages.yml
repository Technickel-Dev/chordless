# Builds the app and publishes dist/ to GitHub Pages on every push to main.
# Deploying through Actions (not a gh-pages branch) skips Jekyll, which would
# otherwise drop the underscore-prefixed chunks Vite emits.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # onnxruntime-node (pulled in by @iwsdk/reference, a local dev tool) tries
      # to download its CUDA add-on from github.com/microsoft/onnxruntime on
      # Linux, and that download now 404s. The site never loads onnxruntime and
      # the npm package already ships the CPU binaries, so skip the CUDA part.
      - run: npm ci
        env:
          npm_config_onnxruntime_node_install_cuda: skip
      - run: npm run typecheck
      # NODE_ENV=production turns off sourcemaps (see vite.config.ts).
      - run: npm run build
        env:
          NODE_ENV: production
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
